version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: botcraft-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=${MONGODB_URL:-mongodb://mongodb:27017}
      - DATABASE_NAME=${DATABASE_NAME:-core_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - AWS_BUCKET_URL=${AWS_BUCKET_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME}
      - PINECONE_HOST=${PINECONE_HOST}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-false}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ORIGINS=${CORS_ORIGINS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      - mongodb
      - redis
    networks:
      - botcraft-network
    volumes:
      - ./apps/backend:/app
    restart: unless-stopped

  # Frontend Next.js Service
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time. Must be the URL the
        # BROWSER uses to reach the backend (not the docker-internal name).
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: botcraft-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - botcraft-network
    restart: unless-stopped

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: botcraft-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - botcraft-network
    restart: unless-stopped

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: botcraft-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - botcraft-network
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: botcraft-celery-worker
    command: celery -A app.workers.file_processing worker --loglevel=info
    environment:
      - MONGODB_URL=${MONGODB_URL:-mongodb://mongodb:27017}
      - DATABASE_NAME=${DATABASE_NAME:-core_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - AWS_BUCKET_URL=${AWS_BUCKET_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME}
      - PINECONE_HOST=${PINECONE_HOST}
    depends_on:
      - backend
      - redis
    networks:
      - botcraft-network
    volumes:
      - ./apps/backend:/app
    restart: unless-stopped

networks:
  botcraft-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
